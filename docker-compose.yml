version: '3.7'
services:
  redis:
    image: redis:latest
    restart: always
    container_name: 'redis_campaigns_${CONTAINER_NAME}'
    env_file:
      - .env
    environment:
      REDIS_PWD: '${REDIS_PWD}'
    command: redis-server --bind 0.0.0.0 --port ${REDIS_PORT} --save 20 1 --loglevel warning --requirepass ${REDIS_PWD} --appendonly yes
    volumes:
      - ./data/redis:/data
    network_mode: host
  app:
    restart: always
    container_name: campaigns-greenchat_${CONTAINER_NAME}
    volumes:
      - ./data:/logs
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    network_mode: host
